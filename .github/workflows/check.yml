name: Check psychologist appointments
on:
  schedule:
    # 09:07 and 21:07 Moscow time (UTC+3 year-round).
    - cron: '7 6,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psychologist-slots
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DELIVERY_URL: ${{ secrets.DELIVERY_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Timepad and deliver available slots
        run: python3 check.py
