name: Probe fast Timepad API
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TIMEPAD_TOKEN: ${{ secrets.TIMEPAD_TOKEN }}
    steps:
      - name: Probe one public appointment
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          url='https://api.timepad.ru/v1/events/4269284.json?fields=registration_data'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Authorization':'Bearer '+os.environ['TIMEPAD_TOKEN']})
          t=time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  d=json.load(r)
                  print('status',r.status,'seconds',round(time.monotonic()-t,2),'event',d.get('id'),'open',d.get('registration_data',{}).get('is_registration_open'))
          except urllib.error.HTTPError as e:
              print('status',e.code,'seconds',round(time.monotonic()-t,2))
          PY
